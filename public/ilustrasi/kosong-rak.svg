<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Ilustrasi rak arsip: dua dari lima slot terisi berkas, tiga slot masih kosong</title>
  <desc>Dipakai pada keadaan kosong daftar tugas divisi dan katalog dokumen. Alasan: yang kosong di sana adalah isi rak divisi, jadi yang digambar adalah rak dengan slot yang masih menunggu berkas. Satu map memakai aksen #B7091E sebagai penanda berkas milik divisi ini.</desc>

  <rect x="52" y="26" width="216" height="144" rx="6" fill="#191B27"/>
  <line x1="66" y1="70" x2="254" y2="70" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="66" y1="112" x2="254" y2="112" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="66" y1="154" x2="254" y2="154" stroke="#FFFFFF" stroke-width="2"/>

  <rect x="70" y="36" width="32" height="34" rx="2" fill="#FFFFFF"/>
  <rect x="77" y="28" width="14" height="10" rx="2" fill="#E5E7EB"/>
  <rect x="110" y="36" width="32" height="34" rx="2" fill="#FFFFFF"/>
  <rect x="117" y="28" width="14" height="10" rx="2" fill="#B7091E"/>

  <rect x="70" y="78" width="32" height="34" rx="2" fill="#FFFFFF"/>
  <rect x="77" y="70" width="14" height="10" rx="2" fill="#E5E7EB"/>

  <rect x="0" y="178" width="320" height="6" fill="#191B27"/>
</svg>

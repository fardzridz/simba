<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Ilustrasi keadaan kosong: baki tugas dengan satu kartu terisi sebagian dan satu slot tugas yang belum diisi</title>
  <desc>Dipakai pada keadaan kosong daftar tugas staf. Alasan: layar ini kosong justru karena belum ada tugas yang ditugaskan, jadi yang digambar adalah baki berkas dengan satu slot tugas yang menunggu. Bentuk utama memakai warna bidang navigasi #191B27 supaya senada dengan rangka aplikasi. Aksen tunggal #B7091E.</desc>

  <rect x="44" y="120" width="136" height="44" rx="6" fill="#191B27"/>

  <rect x="56" y="84" width="112" height="64" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
  <line x1="70" y1="102" x2="150" y2="102" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="118" x2="120" y2="118" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round"/>
  <rect x="70" y="128" width="42" height="14" rx="3" fill="#B7091E"/>

  <rect x="196" y="84" width="88" height="64" rx="4" fill="none" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="240" cy="116" r="16" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <line x1="232" y1="116" x2="248" y2="116" stroke="#D1D5DB" stroke-width="2"/>
  <line x1="240" y1="108" x2="240" y2="124" stroke="#D1D5DB" stroke-width="2"/>

  <rect x="0" y="172" width="320" height="6" fill="#191B27"/>
</svg>

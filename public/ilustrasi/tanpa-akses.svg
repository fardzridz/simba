<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Ilustrasi tanpa akses: satu kartu berkas di dalam batas cakupan dan lemari arsip di luar cakupan</title>
  <desc>Dipakai pada keadaan tanpa akses dan layar 403. Alasan: yang membedakan halaman ini bukan hiasan, melainkan batas cakupan divisi, jadi yang digambar adalah kartu milik akun ini di satu sisi garis dan lemari arsip yang di luar cakupannya. Aksen tunggal #B7091E dipakai untuk garis batas.</desc>

  <rect x="44" y="52" width="100" height="88" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
  <line x1="58" y1="74" x2="130" y2="74" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round"/>
  <line x1="58" y1="92" x2="104" y2="92" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round"/>
  <rect x="58" y="108" width="42" height="16" rx="3" fill="#B7091E"/>
  <line x1="65" y1="116" x2="93" y2="116" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <line x1="170" y1="26" x2="170" y2="168" stroke="#B7091E" stroke-width="2" stroke-dasharray="8 6"/>

  <rect x="196" y="30" width="104" height="138" rx="6" fill="#191B27"/>
  <line x1="210" y1="72" x2="286" y2="72" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="210" y1="112" x2="286" y2="112" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="234" y="52" width="28" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="234" y="92" width="28" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="234" y="132" width="28" height="6" rx="3" fill="#FFFFFF"/>

  <rect x="0" y="170" width="320" height="6" fill="#191B27"/>
</svg>

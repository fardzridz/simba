  <text x="260" y="470" font-size="12" fill="#6B7280">NIP kosong ditampilkan "-". Data kepegawaian diubah Super Admin.</text>
  <text x="260" y="492" font-size="12" fill="#6B7280">Surel dan nomor WhatsApp diatur di kartu Kontak &amp; notifikasi.</text>


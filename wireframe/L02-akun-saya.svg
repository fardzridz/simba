  <text x="1180" y="645" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Ubah Nomor</text>

  <rect x="260" y="670" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="284" y="683" font-size="12" fill="#374151">Email</text>
  <text x="330" y="683" font-size="12" fill="#6B7280">mati</text>
  <rect x="400" y="670" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="424" y="683" font-size="12" fill="#374151">WhatsApp</text>
  <text x="490" y="683" font-size="12" fill="#6B7280">mati</text>
  <text x="260" y="702" font-size="12" fill="#6B7280">Kanal luar mati secara default. Notifikasi in-app tetap selalu aktif.</text>
  <text x="776" y="683" font-size="12" fill="#6B7280">Satu nomor hanya boleh terpasang di satu akun.</text>
  <text x="776" y="702" font-size="12" fill="#6B7280">Ubah surel menunggu tautan verifikasi ke alamat baru.</text>

  <text x="244" y="744" font-size="12" fill="#374151">Surel bukan untuk masuk. Perubahan berlaku setelah tautan verifikasi dibuka.</text>
  <text x="244" y="766" font-size="12" fill="#374151">Kode WhatsApp berlaku 10 menit dan maksimal 5 percobaan. Kirim ulang paling cepat 60 detik.</text>
  <text x="244" y="788" font-size="12" fill="#6B7280">Setiap perubahan kontak menulis log berisi nilai lama dan baru.</text>

  <g transform="translate(928,631) scale(0.75)" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></g>
  <text x="946" y="641" font-size="12" fill="#374151">Terverifikasi</text>

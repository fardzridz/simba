  <text x="778" y="218" font-size="12" font-weight="500" fill="#374151">Kata sandi saat ini</text>
  <rect x="778" y="226" width="446" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="794" y="251" font-size="13" fill="#374151">••••••••••••</text>

  <text x="778" y="296" font-size="12" font-weight="500" fill="#374151">Kata sandi baru</text>
  <rect x="778" y="304" width="446" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="794" y="329" font-size="13" fill="#6B7280">Minimal 12 karakter</text>

  <text x="778" y="374" font-size="12" font-weight="500" fill="#374151">Ulangi kata sandi baru</text>
  <rect x="778" y="382" width="446" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="794" y="407" font-size="13" fill="#6B7280">Ulangi kata sandi baru</text>

  <rect x="778" y="442" width="446" height="40" rx="8" fill="#B7091E"/>
  <text x="1001" y="467" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Simpan Kata Sandi</text>

  <text x="778" y="508" font-size="12" fill="#6B7280">Sesi lain akan diakhiri setelah kata sandi berubah.</text>
  <text x="778" y="528" font-size="12" fill="#6B7280">Sesi berakhir otomatis setelah 8 jam tanpa aktivitas.</text>


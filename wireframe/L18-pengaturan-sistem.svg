  <path d="M270 440 l4 4 l7 -8" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="290" y="445" font-size="12" fill="#374151">XLSX</text>
  <rect x="336" y="426" width="58" height="28" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  <path d="M346 440 l4 4 l7 -8" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="366" y="445" font-size="12" fill="#374151">JPG</text>

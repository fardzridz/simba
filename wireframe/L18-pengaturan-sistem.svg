  <text x="722" y="210" font-size="12" fill="#6B7280" text-anchor="end">Seluruh institusi</text>
  <line x1="260" y1="222" x2="722" y2="222" stroke="#E5E7EB"/>

  <text x="260" y="248" font-size="12" fill="#374151">Ukuran maksimum per berkas</text>
  <rect x="260" y="256" width="462" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="272" y="279" font-size="13" fill="#111827">10 MB</text>
  <path d="M698 271 l6 6 l6 -6" stroke="#6B7280" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <text x="260" y="318" font-size="12" fill="#374151">Jumlah berkas per pengumpulan</text>
  <rect x="260" y="326" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="272" y="349" font-size="13" fill="#111827">5</text>
  <text x="400" y="350" font-size="12" fill="#6B7280">Termasuk semua lampiran.</text>

  <text x="260" y="386" font-size="12" fill="#374151">Tipe berkas yang diterima</text>
  <rect x="260" y="394" width="56" height="28" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  <path d="M270 408 l4 4 l7 -8" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="290" y="413" font-size="12" fill="#374151">PDF</text>
  <rect x="324" y="394" width="60" height="28" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  <path d="M334 408 l4 4 l7 -8" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="354" y="413" font-size="12" fill="#374151">DOC</text>
  <rect x="392" y="394" width="68" height="28" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  <path d="M402 408 l4 4 l7 -8" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="422" y="413" font-size="12" fill="#374151">DOCX</text>

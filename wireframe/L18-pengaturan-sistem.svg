  <path d="M484 440 l4 4 l7 -8" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="504" y="445" font-size="12" fill="#374151">PNG</text>

  <text x="260" y="480" font-size="12" fill="#6B7280">Klik chip untuk menyalakan atau mematikan tipe.</text>
  <text x="260" y="500" font-size="12" fill="#6B7280">Berkas di luar daftar ditolak server, bukan hanya di klien.</text>

  <!-- ambang tenggat -->
  <rect x="762" y="182" width="494" height="350" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="778" y="210" font-size="15" font-weight="600" fill="#111827">Ambang tenggat dekat</text>
  <text x="1240" y="210" font-size="12" fill="#6B7280" text-anchor="end">Seluruh institusi</text>
  <line x1="778" y1="222" x2="1240" y2="222" stroke="#E5E7EB"/>

  <text x="778" y="248" font-size="12" fill="#374151">Sisa waktu dianggap dekat</text>
  <rect x="778" y="256" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="790" y="279" font-size="13" fill="#111827">3</text>
  <text x="910" y="280" font-size="12" fill="#6B7280">hari</text>
  <text x="778" y="324" font-size="12" fill="#6B7280">Dipakai pada label Tugas Mendekati Tenggat dan tanda di tabel.</text>
  <text x="778" y="344" font-size="12" fill="#6B7280">Batas 1 sampai 30 hari. Nilai di luar itu ditolak server.</text>

  <rect x="778" y="372" width="462" height="100" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="794" y="400" font-size="12" fill="#374151">Pengumpulan setelah tenggat tetap diterima.</text>
  <text x="794" y="420" font-size="12" fill="#6B7280">Statusnya ditandai terlambat pada tabel dan laporan.</text>
  <text x="794" y="440" font-size="12" fill="#6B7280">Tenggat disimpan sampai 23:59:59 WIB.</text>
  <text x="794" y="460" font-size="12" fill="#6B7280">Ambang ini tidak mengubah status tugas.</text>

  <!-- aksi -->
  <text x="244" y="568" font-size="12" fill="#6B7280">Perubahan berlaku untuk seluruh divisi setelah disimpan.</text>
  <rect x="936" y="552" width="128" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="1000" y="576" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">Batal</text>
  <rect x="1080" y="552" width="176" height="36" rx="8" fill="#B7091E"/>
  <text x="1168" y="576" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Simpan Pengaturan</text>

  <text x="244" y="632" font-size="12" fill="#374151">Tab ini hanya dibuka Super Admin. Admin Divisi tidak melihat tab Sistem.</text>
  <text x="244" y="654" font-size="12" fill="#374151">Batas atas ukuran berkas 10 MB mengikuti batas aplikasi; setelan hanya dapat menurunkan.</text>
  <text x="244" y="676" font-size="12" fill="#6B7280">Perubahan tidak berlaku surut untuk berkas dan tugas yang sudah ada.</text>
  <text x="244" y="698" font-size="12" fill="#6B7280">Setiap simpan menulis log berisi nilai lama dan baru.</text>

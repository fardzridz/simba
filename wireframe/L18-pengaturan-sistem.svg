  <text x="1240" y="72" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">SA</text>

  <text x="244" y="124" font-size="12" fill="#6B7280">Kebijakan berkas dan ambang tenggat untuk seluruh institusi.</text>

  <!-- tab -->
  <text x="244" y="154" font-size="13" fill="#6B7280">Divisi</text>
  <text x="336" y="154" font-size="13" font-weight="600" fill="#111827">Sistem</text>
  <rect x="336" y="160" width="42" height="2" fill="#B7091E"/>
  <line x1="244" y1="166" x2="1256" y2="166" stroke="#E5E7EB"/>


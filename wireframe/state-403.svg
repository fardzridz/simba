  <text x="244" y="580" font-size="12" fill="#6B7280">Yang tidak ditampilkan pada halaman ini: nama pemilik data, nomor tugas, jumlah baris, dan pesan galat teknis.</text>
  <text x="244" y="604" font-size="12" fill="#6B7280">Cakupan diperiksa di server untuk setiap permintaan, termasuk setiap unduhan berkas.</text>

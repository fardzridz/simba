<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Keadaan memuat, tiga pola</title>
  <rect width="1240" height="420" fill="#FFFFFF"/>
  <text x="24" y="26" font-size="12" fill="#6B7280">WIREFRAME keadaan memuat: skeleton tabel, skeleton kartu KPI, tombol aria-busy</text>
  <text x="1216" y="26" font-size="12" fill="#6B7280" text-anchor="end">data contoh (seed), bukan data nyata</text>

  <rect x="20" y="80" width="380" height="300" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="106" font-size="12" font-weight="600" fill="#374151">Skeleton tabel daftar</text>
  <rect x="36" y="120" width="348" height="28" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <rect x="48" y="130" width="80" height="10" rx="4" fill="#E5E7EB"/>
  <rect x="300" y="130" width="60" height="10" rx="4" fill="#E5E7EB"/>
  <rect x="36" y="160" width="180" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="36" y="178" width="120" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="240" y="160" width="60" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="320" y="160" width="64" height="18" rx="6" fill="#F3F4F6"/>
  <line x1="36" y1="200" x2="384" y2="200" stroke="#E5E7EB"/>
  <rect x="36" y="212" width="200" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="36" y="230" width="140" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="240" y="212" width="60" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="320" y="212" width="64" height="18" rx="6" fill="#F3F4F6"/>
  <line x1="36" y1="252" x2="384" y2="252" stroke="#E5E7EB"/>
  <rect x="36" y="264" width="170" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="36" y="282" width="110" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="240" y="264" width="60" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="320" y="264" width="64" height="18" rx="6" fill="#F3F4F6"/>
  <line x1="36" y1="304" x2="384" y2="304" stroke="#E5E7EB"/>
  <rect x="36" y="316" width="190" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="36" y="334" width="130" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="240" y="316" width="60" height="12" rx="4" fill="#F3F4F6"/>
  <rect x="320" y="316" width="64" height="18" rx="6" fill="#F3F4F6"/>
  <text x="36" y="370" font-size="12" fill="#6B7280">Tinggi baris sama dengan tabel asli, supaya tidak melompat.</text>

  <rect x="430" y="80" width="380" height="300" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="446" y="106" font-size="12" font-weight="600" fill="#374151">Skeleton pita KPI</text>
  <rect x="446" y="122" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="462" y="146" width="70" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="462" y="170" width="52" height="24" rx="4" fill="#F3F4F6"/>
  <rect x="626" y="122" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="642" y="146" width="70" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="642" y="170" width="52" height="24" rx="4" fill="#F3F4F6"/>
  <rect x="446" y="218" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="462" y="242" width="70" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="462" y="266" width="52" height="24" rx="4" fill="#F3F4F6"/>
  <rect x="626" y="218" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="642" y="242" width="70" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="642" y="266" width="52" height="24" rx="4" fill="#F3F4F6"/>
  <text x="446" y="334" font-size="12" fill="#6B7280">Jumlah dan ukuran kartu sama dengan keadaan terisi.</text>
  <text x="446" y="358" font-size="12" fill="#6B7280">Angka tidak dikarang sementara data belum tiba.</text>

  <rect x="840" y="80" width="380" height="300" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="856" y="106" font-size="12" font-weight="600" fill="#374151">Tombol dan aksi berjalan</text>
  <rect x="856" y="126" width="180" height="36" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="946" y="150" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Menyimpan...</text>
  <rect x="856" y="176" width="180" height="36" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="946" y="200" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Menyiapkan berkas, 378 baris</text>
  <rect x="856" y="226" width="180" height="36" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="946" y="250" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Mengunggah 2 dari 3</text>
  <text x="856" y="290" font-size="12" fill="#374151">Tombol memakai aria-busy dan menyebut apa yang terjadi.</text>
  <text x="856" y="314" font-size="12" fill="#6B7280">Tombol terkunci selama proses, klik ganda tidak berpengaruh.</text>
  <text x="856" y="338" font-size="12" fill="#6B7280">Spinner tanpa teks tidak dipakai, pembaca layar tidak tahu.</text>
  <text x="856" y="362" font-size="12" fill="#6B7280">Setiap keadaan muat punya kalimatnya sendiri.</text>
</svg>
